<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promo Supply - Gestão de Compras</title>
    <meta name="description" content="Promo Supply - Sistema completo de gestão de compras, fornecedores e contratos empresariais" />
    <meta name="author" content="Promo Supply" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://promosupply.com.br/" />

    <!-- DNS Prefetch & Preconnect for faster API calls -->
    <link rel="dns-prefetch" href="https://apuzcrkeqodktmpwobnz.supabase.co" />
    <link rel="preconnect" href="https://apuzcrkeqodktmpwobnz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts to avoid FOUT -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" as="style" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Promo Supply" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:title" content="Promo Supply - Gestão de Compras" />
    <meta property="og:description" content="Sistema completo de gestão de compras, fornecedores e contratos empresariais" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Promo Supply - Gestão de Compras" />
    <meta name="twitter:description" content="Sistema completo de gestão de compras, fornecedores e contratos" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Promo Supply",
      "description": "Sistema completo de gestão de compras, fornecedores e contratos empresariais",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      }
    }
    </script>

    <!-- Inline critical CSS to prevent white flash -->
    <style>
      body { margin: 0; background: #0f172a; }
      @media (prefers-color-scheme: light) { body { background: #ffffff; } }
      #root { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
