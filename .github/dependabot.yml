# Dependabot — atualizações de dependências AGRUPADAS para não inundar o repositório de PRs.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Dependências do app (bun — o mesmo gerenciador da instalação no deploy/CI)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Sem o escopo dentro do prefix: com `prefix: "chore(deps)"` + `include: "scope"` o
      # dependabot escrevia `chore(deps)(deps): bump ...`, que reprova no gate de mensagem de
      # commit (`<tipo>(<escopo>): <assunto>` — scripts/ci/commit-msg-lint.mjs) e deixava todo
      # PR do dependabot vermelho. Aqui o escopo vem so do `include: "scope"` (deps/deps-dev).
      prefix: "chore"
      include: "scope"
    groups:
      producao-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      desenvolvimento:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
          # Sem `major` aqui de proposito: agrupado, major de dev vinha junto com minor num
          # unico PR impossivel de avaliar (o #309 juntou typescript 5.9 -> 7.0, eslint 9 -> 10,
          # @testing-library/jest-dom 7 -> 8 e 3 outros). Major agora abre sozinho, um por vez.

  # Ações dos workflows (fixadas por SHA): mensal, num PR só
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      acoes:
        patterns:
          - "*"
