name: lint

# ⚠️ Required status check name (DO NOT RENAME without updating branch protection):
#       lint / lint
# GitHub composes the status check ID as `<workflow name> / <job name>`.
# Both are pinned to the literal string `lint` so the check ID stays stable
# across refactors. If you change either, update branch protection rules in
# the repository settings (Settings → Branches → main → Required status checks)
# at the same time, or merges will silently stop being gated on lint.

# Dedicated lint gate — runs `bun run lint:all` which sequences:
#   [1/2] npm run lint -- --max-warnings=0   (general ESLint, zero-warnings)
#   [2/2] npm run lint:date-fns              (date-fns barrel import check)
#
# Mode: FAIL-FAST (default). If suite #1 fails, suite #2 is skipped and
# the job exits non-zero immediately — CI surfaces the red build sooner
# and we don't burn runner minutes on a downstream suite that can't
# unblock the merge anyway. To debug both suites in one run locally:
#   LINT_FAIL_FAST=0 bun run lint:all
# (or set the env var on this job for a one-off full run).
#
# Companion to smoke-date-fns.yml / pr-date-fns-smoke.yml — those gate the
# date-fns subpath EXISTENCE on disk; this gate is purely about lint
# correctness (no warnings, no forbidden barrel imports).

on:
  pull_request:
    paths:
      - "src/**"
      - "eslint.config.js"
      - "eslint.date-fns.config.js"
      - "eslint-rules/**"
      - "scripts/lint-all.sh"
      - "scripts/lint-date-fns.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "eslint.config.js"
      - "eslint.date-fns.config.js"
      - "eslint-rules/**"
      - "scripts/lint-all.sh"
      - "scripts/lint-date-fns.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/lint.yml"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint:all (zero warnings + date-fns barrel check)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Verify lockfile is up to date (no drift vs package.json)
        run: bun install --frozen-lockfile --dry-run

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Cache ESLint's incremental cache across CI runs. ESLint is invoked
      # with `--cache --cache-location <path> --cache-strategy content` (see
      # the `lint` script in package.json and scripts/lint-date-fns.sh), so
      # unchanged files whose source + config hash match the last run are
      # skipped entirely on the second pass.
      #
      # Two cache locations are persisted:
      #   • .eslintcache                            — general lint suite
      #   • node_modules/.cache/eslint/             — date-fns lint suite
      #     (.eslintcache-date-fns lives here; kept separate from the
      #      general cache because the two suites use different configs)
      #
      # Cache key is hashed on every input that can change ESLint's output
      # for a given source file: the lint configs, the local rule sources,
      # the lockfile (transitive plugin/parser updates), and package.json
      # (script flags / dependency bumps). restore-keys lets unchanged-config
      # runs benefit from a warm cache even when src/ changed.
      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'eslint.date-fns.config.js', 'eslint-rules/**', 'bun.lock', 'package.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      # The actual gate. `bun run lint:all` runs both suites in sequence
      # in fail-fast mode (LINT_FAIL_FAST=1, the default): if suite #1
      # fails, suite #2 is SKIPPED and the script exits non-zero. The job
      # exits 0 only when BOTH suites pass.
      - name: Run bun run lint:all (fail-fast on any lint error)
        id: lint
        env:
          CI: 'true'
          # Explicit so the mode is visible in the rendered job log even
          # if the script's default ever changes. To diagnose both suites
          # in one CI run, flip this to '0' for a one-off debug job.
          LINT_FAIL_FAST: '1'
          # Force ANSI colors off for cleaner job-log output. The wrapper
          # scripts auto-detect TTY but GitHub Actions lies about being one.
          NO_COLOR: '1'
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          start_ms=$(date +%s%3N)
          if bun run lint:all 2>&1 | tee ci-artifacts/lint-all.log; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            exit_code=0
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit_code=$?
          fi
          end_ms=$(date +%s%3N)
          echo "duration_ms=$((end_ms - start_ms))" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Surface lint failure in job summary
        if: failure()
        run: |
          {
            echo "## ❌ \`bun run lint:all\` failed (fail-fast mode)"
            echo ""
            echo "At least one of the lint suites reported errors:"
            echo "- \`npm run lint -- --max-warnings=0\` (general ESLint, zero-warnings)"
            echo "- \`npm run lint:date-fns\` (date-fns barrel imports)"
            echo ""
            echo "> ℹ️ This job runs in **fail-fast** mode (\`LINT_FAIL_FAST=1\`)."
            echo "> If suite 1 fails, suite 2 is skipped — the summary table in"
            echo "> the log shows \`⊘ skipped\` for any suite that didn't run."
            echo ""
            echo "**Fix locally:**"
            echo '```bash'
            echo "bun run lint:all                       # fail-fast (matches CI)"
            echo "LINT_FAIL_FAST=0 bun run lint:all      # see issues from BOTH suites"
            echo "bun run lint -- --fix                  # autofix general ESLint issues"
            echo "bun run lint:date-fns:fix              # autofix barrel imports"
            echo '```'
            echo ""
            echo "<details><summary>Last 200 lines of the lint:all output</summary>"
            echo ""
            echo '```'
            tail -n 200 ci-artifacts/lint-all.log || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface lint success in job summary
        if: success()
        run: |
          {
            echo "## ✅ \`bun run lint:all\` passed"
            echo ""
            echo "Both lint suites are green:"
            echo "- ✓ \`npm run lint -- --max-warnings=0\`"
            echo "- ✓ \`npm run lint:date-fns\`"
            echo ""
            echo "_Duration: ${{ steps.lint.outputs.duration_ms }}ms_"
          } >> "$GITHUB_STEP_SUMMARY"

      # Generate a machine-readable JSON ESLint report so reviewers can
      # download structured lint output from a failing PR (file-by-file
      # rule violations, line/column, severity) instead of grepping logs.
      #
      # Runs unconditionally (`if: always()`) and tolerates failure
      # (`continue-on-error: true`) because:
      #   • ESLint exits non-zero whenever there are errors — but we still
      #     want the report on red builds (that's the whole point).
      #   • This step is purely diagnostic; the real gate above
      #     (`bun run lint:all`) is what fails the job.
      #
      # `--no-error-on-unmatched-pattern` keeps it green on empty repos.
      # The cache flags mirror the `lint` script so this pass reuses the
      # warm cache from the gate above.
      - name: Generate ESLint JSON report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-artifacts
          bunx eslint . \
            --cache --cache-location .eslintcache --cache-strategy content \
            --no-error-on-unmatched-pattern \
            --format json \
            --output-file ci-artifacts/eslint-report.json || true
          # Emit a tiny summary alongside the raw report for quick triage.
          if [ -f ci-artifacts/eslint-report.json ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync("ci-artifacts/eslint-report.json","utf8"));
              const totals = r.reduce((a,f)=>({errors:a.errors+f.errorCount,warnings:a.warnings+f.warningCount,fixable:a.fixable+f.fixableErrorCount+f.fixableWarningCount,files:a.files+(f.errorCount||f.warningCount?1:0)}),{errors:0,warnings:0,fixable:0,files:0});
              require("fs").writeFileSync("ci-artifacts/eslint-summary.json", JSON.stringify({...totals,totalFiles:r.length},null,2));
              console.log("ESLint summary:", totals);
            ' || true
          fi

      - name: Upload lint:all log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-all-log-${{ github.run_id }}
          path: ci-artifacts/lint-all.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ESLint JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report-${{ github.run_id }}
          path: |
            ci-artifacts/eslint-report.json
            ci-artifacts/eslint-summary.json
          if-no-files-found: warn
          retention-days: 14
