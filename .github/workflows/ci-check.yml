name: CI Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-smoke:
    name: Fast smoke gate (date-fns install + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run ci-smoke.sh
        run: bash scripts/ci-smoke.sh
        env:
          CI: 'true'
          TZ: UTC

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  ci-check:
    name: Full CI gate (date-fns + lint + types + smoke)
    needs: [ci-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run ci-check.sh
        run: bash scripts/ci-check.sh
        env:
          CI: 'true'
          TZ: UTC

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-smoke-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  strict-baseline:
    name: Strict-flag offender baseline gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs `tsc --noEmit -p tsconfig.app.json --<flag>` for every opt-in
      # strict flag listed in ci-artifacts/strict-baseline.json. The job fails
      # only when a diagnostic appears that is not already allowlisted in the
      # baseline offender snapshot. Existing offenders may remain; removed
      # offenders are reported as improvements. JSON output is uploaded as an
      # artifact for inspection.
      - name: Strict-flag offender baseline check
        id: strict
        run: |
          mkdir -p ci-artifacts
          set +e
          node scripts/check-strict-baseline.mjs --json > ci-artifacts/strict-baseline-report.json
          status=$?
          set -e
          # Re-run in human mode so the GHA log is readable too.
          node scripts/check-strict-baseline.mjs || true
          exit $status
        env:
          CI: 'true'
          TZ: UTC

      - name: Upload strict-baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-baseline-report
          path: ci-artifacts/strict-baseline-report.json
          if-no-files-found: warn
          retention-days: 30
