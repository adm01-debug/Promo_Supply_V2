name: verify-critical-deps

# Fails the build if any package listed in .github/critical-dependencies.json
# drifts across package.json, bun.lock, and node_modules. Backed by
# `bun run verify:critical-deps`, which delegates to
# scripts/verify-package-versions.mjs and produces the same side-by-side
# report (per-source values, pairwise diagnosis, fix rationale) used by the
# date-fns gate.
#
# Exit codes surfaced by the script:
#    0      all critical deps aligned
#   10-13  per-package drift (spec / installed / lock / all-differ)
#   20-23  per-package missing (spec / lock / lock-entry / install)
#   30     mixed failures across multiple packages

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/critical-dependencies.json"
      - "scripts/verify-critical-deps.mjs"
      - "scripts/verify-package-versions.mjs"
      - "scripts/lib/resolve-locked-version.mjs"
      - "scripts/lib/semver-diff.mjs"
      - ".github/workflows/verify-critical-deps.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/critical-dependencies.json"
      - "scripts/verify-critical-deps.mjs"
      - "scripts/verify-package-versions.mjs"
      - "scripts/lib/resolve-locked-version.mjs"
      - "scripts/lib/semver-diff.mjs"
      - ".github/workflows/verify-critical-deps.yml"

jobs:
  verify-critical-deps:
    name: Verify critical dependency alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify critical dependency alignment
        run: bun run verify:critical-deps
