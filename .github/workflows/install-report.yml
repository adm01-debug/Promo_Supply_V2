name: Install Report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: install-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-report:
    name: Generate & publish install-report.json
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Use --json-file so the script writes the JSON directly to disk
      # (auto-creates parent dirs). --json keeps the payload mirrored to
      # stdout for inline log auditing; the file is what the upload-artifact
      # step below publishes.
      - name: Generate install-report.json
        id: report
        run: |
          mkdir -p ci-logs
          node scripts/install-report.mjs \
            --json \
            --json-file=ci-artifacts/install-report.json \
            --json-file-overwrite \
            2> >(tee ci-logs/install-report-json-file.log >&2)

      - name: Verify install-report byte count
        env:
          REPORT_PATH: ci-artifacts/install-report.json
          REPORT_LOG: ci-logs/install-report-json-file.log
        run: |
          node -e '
            const fs = require("node:fs");
            const reportPath = process.env.REPORT_PATH;
            const logPath = process.env.REPORT_LOG;
            if (!fs.existsSync(reportPath)) throw new Error(`install-report artifact missing: ${reportPath}`);
            if (!fs.existsSync(logPath)) throw new Error(`install-report byte log missing: ${logPath}`);
            const bytes = fs.statSync(reportPath).size;
            const log = fs.readFileSync(logPath, "utf8");
            const matches = [...log.matchAll(/\((\d+) bytes,\s*(?:pretty|minified)\)/g)];
            const shaMatches = [...log.matchAll(/content hash \(sha256\) → ([0-9a-f]{64})/g)];
            if (matches.length === 0) throw new Error(`No logged byte count found in ${logPath}`);
            if (shaMatches.length === 0) throw new Error(`No logged sha256 found in ${logPath}`);
            const loggedBytes = Number(matches.at(-1)[1]);
            const loggedSha = shaMatches.at(-1)[1];
            
            // Verify bytes
            if (bytes !== loggedBytes) {
              throw new Error(`install-report.json byte count mismatch: file has ${bytes} bytes, log says ${loggedBytes}`);
            }
            
            // Verify content hash
            const crypto = require("node:crypto");
            const actualSha = crypto.createHash("sha256").update(fs.readFileSync(reportPath)).digest("hex");
            if (actualSha !== loggedSha) {
              throw new Error(`install-report.json sha256 mismatch: file has ${actualSha}, log says ${loggedSha}`);
            }
            
            console.log(`install-report.json verified: ${bytes} bytes, sha256 ${actualSha}`);
            if (bytes !== loggedBytes) {
              throw new Error(`install-report.json byte count mismatch: file has ${bytes} bytes, log says ${loggedBytes}`);
            }
            console.log(`install-report.json byte count verified: ${bytes} bytes`);
          '

      # Posts a markdown summary on the GitHub Actions run page using the
      # alignment.* booleans from the JSON. Runs even on failure so reviewers
      # always see the breakdown — most install-report failures ARE alignment
      # mismatches, and the table makes it obvious which axis flipped.
      # Inline node script (no extra files): reads the JSON we just wrote,
      # appends a table to $GITHUB_STEP_SUMMARY, and emits ::warning::
      # annotations for any false alignment booleans so they surface in the
      # PR "Files changed" view too.
      - name: Post install-report alignment summary
        if: always()
        env:
          REPORT_PATH: ci-artifacts/install-report.json
        run: |
          node -e '
            const fs = require("node:fs");
            const path = process.env.REPORT_PATH;
            if (!fs.existsSync(path)) {
              console.log(`::warning::install-report JSON not found at ${path} — skipping summary.`);
              process.exit(0);
            }
            const r = JSON.parse(fs.readFileSync(path, "utf8"));
            const a = r.alignment ?? {};
            const d = r.dateFns ?? {};
            const icon = (b) => (b === true ? "✅" : b === false ? "❌" : "—");
            const status = a.aligned ? "✅ aligned" : "❌ drift detected";
            const md = [
              `## ${status} — install-report`,
              "",
              `**date-fns:** spec \`${d.spec ?? "—"}\` · locked \`${d.locked ?? "—"}\` · installed \`${d.installed ?? "—"}\` · exact-pin ${icon(d.exactPinned)}`,
              "",
              "| Alignment axis | Status | Meaning |",
              "| --- | :---: | --- |",
              `| \`aligned\` | ${icon(a.aligned)} | All three (spec/locked/installed) match. |`,
              `| \`specEqLocked\` | ${icon(a.specEqLocked)} | \`package.json\` spec matches \`bun.lock\`. |`,
              `| \`lockedEqInstalled\` | ${icon(a.lockedEqInstalled)} | \`bun.lock\` matches \`node_modules\`. |`,
              `| \`specEqInstalled\` | ${icon(a.specEqInstalled)} | \`package.json\` spec matches \`node_modules\`. |`,
              "",
              `_Generated at ${r.generatedAt ?? "(unknown)"} · bun.lock sha256 \`${r.bunLock?.sha256 ?? "—"}\`_`,
              "",
            ].join("\n");
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) fs.appendFileSync(summaryPath, md + "\n");
            // Mirror to stdout so the step log is also useful.
            console.log(md);
            // Per-axis ::warning:: annotations — visible in the PR Files tab
            // and the run page sidebar.
            for (const [k, v] of Object.entries(a)) {
              if (v === false) console.log(`::warning title=install-report alignment::${k} is false (see job summary).`);
            }
          '

      - name: Print human-readable report (for log auditing)
        if: always()
        run: node scripts/install-report.mjs

      - name: Detect drift (strict)
        id: strict
        if: always()
        run: node scripts/install-report.mjs --strict --json > /dev/null

      - name: Upload install-report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-report
          path: ci-artifacts/install-report.json
          if-no-files-found: error
          retention-days: 30
