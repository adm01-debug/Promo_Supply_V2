name: pr-date-fns-smoke

# Pull-request gate that runs `bun run date-fns:smoke` (the alias for the
# date-fns subpath smoke pipeline: regen smoke test → verify every imported
# subpath exists in node_modules/date-fns → run the smoke vitest file) and,
# on failure, posts a step-by-step failure summary as a sticky PR comment.
#
# Companion to .github/workflows/smoke-date-fns.yml, which owns the broader
# main-branch + artifact upload story. This workflow is PR-focused: it
# always runs on PRs (no path filter) so the comment shows up consistently
# in code review, and it specifically surfaces the failure recipe inline
# in the PR conversation instead of forcing reviewers to dig into job logs
# or download artifacts.
#
# The verifier (scripts/verify-datefns-files.mjs) already produces the
# Markdown failure report we need — we just pipe its DATEFNS_SMOKE_REPORT_MD
# output through the marketplace `peter-evans/create-or-update-comment`
# action with a stable header so re-runs UPDATE the existing comment
# instead of spamming the PR with new ones.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-date-fns-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `pull-requests: write` is required for the comment step. Everything else
# stays read-only — this workflow never pushes commits or mutates the repo.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-date-fns-smoke:
    name: PR date-fns smoke (comments on failure)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Skip draft PRs to save CI minutes — the `ready_for_review` trigger
    # above will run this job the moment the PR is marked ready.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run date-fns:smoke
        id: smoke
        env:
          CI: 'true'
          TZ: UTC
          # Tell scripts/verify-datefns-files.mjs to write the full Markdown
          # failure report (partitioned missing subpaths + per-subpath
          # offender file:line list + copy-paste bare list + likely-cause
          # diagnosis + 3-step repair recipe with the date-fns version
          # pinned at the moment of failure) to this path on failure.
          # The "Compose PR comment body" step below reads it back.
          DATEFNS_SMOKE_REPORT_MD: ci-artifacts/datefns-failure-report.md
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          if bun run date-fns:smoke 2>&1 | tee ci-artifacts/pr-smoke.log; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Build the PR comment body from the verifier's structured Markdown
      # report when present, falling back to the tail of the run log when
      # the report file wasn't produced (e.g. the smoke step failed BEFORE
      # reaching the verifier — install error, vitest crash, etc.). Always
      # runs on failure so reviewers get inline context regardless of where
      # the failure happened.
      - name: Compose PR comment body
        if: failure() && steps.smoke.outputs.status == 'fail'
        id: comment_body
        run: |
          {
            echo "<!-- pr-date-fns-smoke:comment -->"
            echo "## ❌ \`bun run date-fns:smoke\` failed"
            echo ""
            echo "**Run:** [\`#${{ github.run_number }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "**Commit:** \`${{ github.event.pull_request.head.sha }}\`"
            echo ""
            if [ -f ci-artifacts/datefns-failure-report.md ]; then
              cat ci-artifacts/datefns-failure-report.md
            else
              echo "_(no structured failure report — the smoke step failed before the verifier ran)_"
              echo ""
              echo "<details><summary>Last 200 lines of the run log</summary>"
              echo ""
              echo '```'
              tail -n 200 ci-artifacts/pr-smoke.log || echo "(log unavailable)"
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "---"
            echo "_Re-push to retry — this comment auto-updates on the next run._"
          } > ci-artifacts/pr-comment.md
          # Expose the path (not the contents) to the next step. Comment
          # bodies regularly exceed GitHub's per-output 1MB cap, so we keep
          # the file on disk and read it from there.
          echo "path=ci-artifacts/pr-comment.md" >> "$GITHUB_OUTPUT"

      # Sticky comment — the `body-includes` matcher uses the HTML marker
      # written at the top of the body so subsequent failed runs UPDATE the
      # same comment instead of stacking new ones in the PR conversation.
      - name: Post / update failure comment
        if: failure() && steps.smoke.outputs.status == 'fail'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.comment_body.outputs.path }}
          edit-mode: replace
          # Marker matched against the existing comment body. Must stay
          # in sync with the HTML comment emitted by "Compose PR comment
          # body" above.
          body-includes: '<!-- pr-date-fns-smoke:comment -->'

      # When a previously-failing PR turns green, leave a tiny success
      # update on the same sticky comment so reviewers can see at a glance
      # that the issue was resolved (instead of being left looking at a
      # stale failure comment). Only runs when the smoke step passed AND
      # an existing failure comment is present, so green PRs that were
      # never broken don't get a comment at all.
      - name: Resolve previous failure comment (if any)
        if: success() && steps.smoke.outputs.status == 'pass'
        uses: peter-evans/create-or-update-comment@v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- pr-date-fns-smoke:comment -->
            ## ✅ `bun run date-fns:smoke` is green

            All imported `date-fns` subpaths resolve on the pinned version.

            **Run:** [`#${{ github.run_number }}`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Commit:** `${{ github.event.pull_request.head.sha }}`
          edit-mode: replace
          body-includes: '<!-- pr-date-fns-smoke:comment -->'

      - name: Upload PR smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-date-fns-smoke-${{ github.run_id }}
          path: |
            ci-artifacts/pr-smoke.log
            ci-artifacts/datefns-failure-report.md
            ci-artifacts/pr-comment.md
          if-no-files-found: warn
          retention-days: 14
