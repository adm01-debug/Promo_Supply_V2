name: typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Verify lockfile is up to date (no drift vs package.json)
        run: bun install --frozen-lockfile --dry-run
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Type-check tsconfig.app.json
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Type-check tsconfig.node.json
        if: ${{ hashFiles('tsconfig.node.json') != '' }}
        run: bunx tsc --noEmit -p tsconfig.node.json
      - name: Generate typecheck report artifact
        if: always()
        run: node scripts/typecheck-report.mjs
      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: ci-artifacts/typecheck-report.json
          if-no-files-found: error
          retention-days: 30
