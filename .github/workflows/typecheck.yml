name: typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun package store
        # Caches Bun's global download/install store keyed on bun.lock so PRs
        # that don't change deps skip the network entirely on `bun install`.
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache tsc incremental build info
        # Caches the .tsbuildinfo files emitted by tsc --incremental so
        # unchanged files are skipped on subsequent typechecks. Key is
        # invalidated whenever tsconfigs or any tracked source file changes,
        # with a permissive restore-key so partial reuse still helps.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('tsconfig*.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('tsconfig*.json') }}-
            ${{ runner.os }}-tsbuildinfo-
      - name: Cache ESLint results
        # Caches ESLint's --cache file so unchanged source files are skipped
        # on subsequent runs. Key is invalidated when ESLint config or any
        # of its dependencies change; restore-keys allow partial reuse so
        # PRs that only touch a few files still benefit on the next push.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js', 'eslint.date-fns.config.js', 'eslint-rules/**/*.js', 'package.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js', 'eslint.date-fns.config.js', 'eslint-rules/**/*.js', 'package.json', 'bun.lock') }}-
            ${{ runner.os }}-eslint-
      - name: Print cache key inputs (sha256 of lock + config files)
        # Diagnostic: prints the exact hash values GitHub used to compose
        # the cache keys above. Lets you eyeball cache (in)validation from
        # the run log — if bun.lock's hash is the same as the previous run,
        # the Bun cache should hit; if it changed, expect a cold install.
        # Also appends a compact table to $GITHUB_STEP_SUMMARY so you can
        # diff hashes across runs without scrolling the raw log.
        run: |
          set -euo pipefail
          hash_of() {
            if [ -f "$1" ]; then
              sha256sum "$1" | awk '{print $1}'
            else
              echo "(missing)"
            fi
          }
          BUN_HASH=$(hash_of bun.lock)
          PKG_HASH=$(hash_of package.json)
          ESLINT_CFG_HASH=$(hash_of eslint.config.js)
          ESLINT_DF_CFG_HASH=$(hash_of eslint.date-fns.config.js)
          TSCFG_APP_HASH=$(hash_of tsconfig.app.json)
          TSCFG_NODE_HASH=$(hash_of tsconfig.node.json)
          TSCFG_BASE_HASH=$(hash_of tsconfig.json)

          echo "── Cache key inputs (sha256) ──"
          printf '  %-28s %s\n' "bun.lock"                 "$BUN_HASH"
          printf '  %-28s %s\n' "package.json"             "$PKG_HASH"
          printf '  %-28s %s\n' "eslint.config.js"         "$ESLINT_CFG_HASH"
          printf '  %-28s %s\n' "eslint.date-fns.config.js" "$ESLINT_DF_CFG_HASH"
          printf '  %-28s %s\n' "tsconfig.json"            "$TSCFG_BASE_HASH"
          printf '  %-28s %s\n' "tsconfig.app.json"        "$TSCFG_APP_HASH"
          printf '  %-28s %s\n' "tsconfig.node.json"       "$TSCFG_NODE_HASH"

          # Surface the same table at the top of the run page.
          {
            echo "### Cache key inputs (sha256)";
            echo "";
            echo "| File | sha256 |";
            echo "| --- | --- |";
            echo "| \`bun.lock\` | \`$BUN_HASH\` |";
            echo "| \`package.json\` | \`$PKG_HASH\` |";
            echo "| \`eslint.config.js\` | \`$ESLINT_CFG_HASH\` |";
            echo "| \`eslint.date-fns.config.js\` | \`$ESLINT_DF_CFG_HASH\` |";
            echo "| \`tsconfig.json\` | \`$TSCFG_BASE_HASH\` |";
            echo "| \`tsconfig.app.json\` | \`$TSCFG_APP_HASH\` |";
            echo "| \`tsconfig.node.json\` | \`$TSCFG_NODE_HASH\` |";
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify lockfile is up to date (no drift vs package.json)
        run: bun install --frozen-lockfile --dry-run
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # ──────────────────────────────────────────────────────────────────────
      # Lint runs IMMEDIATELY after install and BEFORE tsc, so syntax/style
      # failures surface first on the PR — devs don't wait for a full
      # typecheck to learn about a missing semicolon or unused import.
      # ──────────────────────────────────────────────────────────────────────
      - name: Determine changed files (PR vs base, push vs previous commit)
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          # Fall back to a full diff if BASE_SHA is missing or all-zeros (first push, force-push).
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')"
          else
            CHANGED="$(git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$HEAD_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' || true)"
          fi
          # Filter to existing files only (skip deletions).
          EXISTING=""
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] && EXISTING="$EXISTING $f"
          done <<< "$CHANGED"
          EXISTING="$(echo "$EXISTING" | xargs || true)"
          echo "files=$EXISTING" >> "$GITHUB_OUTPUT"
          if [ -z "$EXISTING" ]; then
            echo "No lintable files changed."
          else
            echo "Changed lintable files:"
            echo "$EXISTING" | tr ' ' '\n'
          fi

      - name: ESLint on changed files (blocks on lint or type-aware rule failures)
        if: ${{ steps.changed.outputs.files != '' }}
        env:
          # Persistent ESLint cache shared with the actions/cache step above.
          # Path is intentionally inside node_modules/ so it inherits the
          # repo's existing gitignore and never gets committed.
          ESLINT_CACHE_DIR: node_modules/.cache/eslint
        run: |
          mkdir -p ci-artifacts "$ESLINT_CACHE_DIR"
          # Persist the changed-files manifest so failure artifacts are
          # self-explanatory ("which files did this run actually lint?").
          printf '%s\n' ${{ steps.changed.outputs.files }} > ci-artifacts/eslint-changed-files.txt
          # --cache + --cache-location: skip files whose source + config hash
          # is unchanged since last run. --cache-strategy=content survives
          # mtime-only changes (e.g. fresh checkouts on every CI run).
          # --max-warnings=0 ensures warnings (including type-aware rules surfaced as warnings)
          # also block the merge. Output a JSON report alongside human-readable stylish output.
          # Tee stderr+stdout to a log so failures upload the raw error lines, not just the formatted report.
          set -o pipefail
          bunx eslint ${{ steps.changed.outputs.files }} \
            --cache \
            --cache-location "$ESLINT_CACHE_DIR/.eslintcache" \
            --cache-strategy content \
            --max-warnings=0 \
            --format stylish \
            --output-file ci-artifacts/eslint-report.txt \
            2>&1 | tee ci-artifacts/eslint-stdout.log \
            || ESLINT_EXIT=$?
          # Re-emit the human report to the job log so failures are visible without downloading artifacts.
          if [ -f ci-artifacts/eslint-report.txt ]; then
            echo "── ESLint report ──"
            cat ci-artifacts/eslint-report.txt
          fi
          # Also emit a JSON report for programmatic inspection. Reuses the
          # same cache, so this second pass is essentially free.
          bunx eslint ${{ steps.changed.outputs.files }} \
            --cache \
            --cache-location "$ESLINT_CACHE_DIR/.eslintcache" \
            --cache-strategy content \
            --max-warnings=0 \
            --format json \
            --output-file ci-artifacts/eslint-report.json || true
          exit ${ESLINT_EXIT:-0}

      - name: Summarize ESLint failures (file + rule)
        # Runs only when the lint step above failed. Parses the JSON report
        # into a compact "<file>:<line>:<col>  <rule>  <message>" table,
        # prints it to the job log, writes it to ci-artifacts/eslint-summary.txt
        # so it ships in the uploaded artifact, and appends it to
        # $GITHUB_STEP_SUMMARY so it surfaces at the top of the failed run
        # without opening artifacts.
        if: ${{ failure() && steps.changed.outputs.files != '' }}
        run: |
          set -euo pipefail
          REPORT=ci-artifacts/eslint-report.json
          OUT=ci-artifacts/eslint-summary.txt
          if [ ! -s "$REPORT" ]; then
            echo "ESLint JSON report missing or empty — falling back to raw stdout."
            cp ci-artifacts/eslint-stdout.log "$OUT" 2>/dev/null || echo "(no eslint output captured)" > "$OUT"
          else
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const data = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const rows = [];
              const ruleCounts = new Map();
              let totalErrors = 0;
              let totalWarnings = 0;
              for (const f of data) {
                totalErrors += f.errorCount ?? 0;
                totalWarnings += f.warningCount ?? 0;
                for (const m of f.messages ?? []) {
                  if (m.severity !== 2 && m.severity !== 1) continue;
                  const sev = m.severity === 2 ? "error" : "warn ";
                  const rule = m.ruleId ?? "(parse)";
                  ruleCounts.set(rule, (ruleCounts.get(rule) ?? 0) + 1);
                  // Trim repo prefix to keep lines short.
                  const file = f.filePath.replace(process.cwd() + "/", "");
                  rows.push(`${sev}  ${file}:${m.line ?? 0}:${m.column ?? 0}  ${rule}  ${m.message.replace(/\s+/g, " ").slice(0, 140)}`);
                }
              }
              const lines = [];
              lines.push(`ESLint failed: ${totalErrors} error(s), ${totalWarnings} warning(s) across ${data.length} file(s).`);
              lines.push("");
              lines.push("Top rules:");
              const top = [...ruleCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
              for (const [rule, count] of top) lines.push(`  ${String(count).padStart(4)}  ${rule}`);
              lines.push("");
              lines.push("Findings:");
              for (const r of rows.slice(0, 200)) lines.push(`  ${r}`);
              if (rows.length > 200) lines.push(`  … ${rows.length - 200} more (see eslint-report.txt)`);
              process.stdout.write(lines.join("\n") + "\n");
            ' "$REPORT" | tee "$OUT"
          fi
          # Surface the summary at the top of the GitHub Actions run page.
          {
            echo "### ESLint failures";
            echo '```';
            cat "$OUT";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ESLint report
        # Always upload — even on success — but never fail the job because the
        # artifact is missing (e.g. no lintable files changed in this PR).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            ci-artifacts/eslint-report.txt
            ci-artifacts/eslint-report.json
            ci-artifacts/eslint-stdout.log
            ci-artifacts/eslint-changed-files.txt
            ci-artifacts/eslint-summary.txt
          if-no-files-found: ignore
          retention-days: 30

      # ──────────────────────────────────────────────────────────────────────
      # Typecheck runs AFTER lint. tsc is the slowest step in this job, so
      # putting it last means devs see fast lint feedback first; tsc still
      # runs (and blocks merge) on every push/PR via the steps below.
      #
      # Each tsc invocation tees its output to ci-artifacts/tsc-*.log so
      # failure artifacts contain the raw "TSxxxx" diagnostic lines, not
      # just the summary report from typecheck-report.mjs.
      # ──────────────────────────────────────────────────────────────────────
      - name: Type-check tsconfig.app.json
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          bunx tsc --noEmit -p tsconfig.app.json 2>&1 | tee ci-artifacts/tsc-app.log
      - name: Type-check tsconfig.node.json
        if: ${{ hashFiles('tsconfig.node.json') != '' }}
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          bunx tsc --noEmit -p tsconfig.node.json 2>&1 | tee ci-artifacts/tsc-node.log

      - name: Generate typecheck report artifact
        if: always()
        run: node scripts/typecheck-report.mjs || true

      # ──────────────────────────────────────────────────────────────────────
      # Advanced strict-flag ratchet. Runs the candidate flags listed in
      # ci-artifacts/strict-baseline.json (currently:
      # noPropertyAccessFromIndexSignature, exactOptionalPropertyTypes,
      # noUncheckedIndexedAccess) against tsconfig.app.json one at a time.
      #
      # Behaviour per flag:
      #   • baseline > 0 → "ratchet" mode: passes while errors ≤ baseline,
      #     FAILS if errors went up. New strict-flag violations cannot
      #     sneak in even though the flags themselves aren't promoted yet.
      #   • baseline = 0 → "must-be-zero" mode: any error fails the job.
      #     This is the green light to move the flag into tsconfig.app.json
      #     (and remove it from strict-baseline.json) in the next PR.
      #
      # Once ALL three flags hit baseline=0 and are promoted into
      # tsconfig.app.json, this step becomes redundant and can be deleted
      # along with strict-baseline.json.
      # ──────────────────────────────────────────────────────────────────────
      - name: Strict-flag ratchet (advanced strict)
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          node scripts/check-strict-baseline.mjs --json \
            > ci-artifacts/strict-baseline-result.json || STRICT_EXIT=$?
          # Re-emit human-readable form to job log + step summary so failures
          # are visible without downloading artifacts.
          node scripts/check-strict-baseline.mjs | tee ci-artifacts/strict-baseline-summary.txt
          {
            echo "### Strict-flag ratchet";
            echo '```';
            cat ci-artifacts/strict-baseline-summary.txt;
            echo '```';
            echo "_Baseline lives in \`ci-artifacts/strict-baseline.json\`. Lower it with \`node scripts/check-strict-baseline.mjs --update\` after a cleanup PR; promote a flag into \`tsconfig.app.json\` once its baseline reaches 0._";
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${STRICT_EXIT:-0}

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: |
            ci-artifacts/typecheck-report.json
            ci-artifacts/tsc-app.log
            ci-artifacts/tsc-node.log
            ci-artifacts/strict-baseline.json
            ci-artifacts/strict-baseline-result.json
            ci-artifacts/strict-baseline-summary.txt
          if-no-files-found: ignore
          retention-days: 30
