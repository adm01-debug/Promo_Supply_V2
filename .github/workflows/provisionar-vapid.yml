# docs:
#   gatilho: dispatch manual com confirmacao APLICAR; roda so quando o dono decidir publicar as chaves
#   prova: a Management API responde 200 para o post de secrets e o GET seguinte lista VAPID_PUBLIC_KEY e VAPID_PRIVATE_KEY no projeto oficial
#   falha: 403/erro da API deixa o job vermelho e NENHUMA chave e' gravada parcialmente (uma chamada, um payload)
#   avisa: o resumo do run lista os nomes das secrets publicadas (nunca os valores) e o ref do projeto
# nao-e-bug:
#   - sem-eco-de-valor: a chave privada nunca aparece no log; o workflow imprime apenas nomes
#   - sem-rotacao: reprovisionar a MESMA chave e' idempotente; rotacionar exige publicar de novo e reinstalar o PWA em cada dispositivo, por isso nao roda sozinho
#   - secret-ausente: sem SUPABASE_ACCESS_TOKEN/VITE_SUPABASE_PROJECT_ID e sem os valores VAPID o job falha fechado
# ==================================================================
# PROMO SUPPLY - Provisionar as chaves VAPID na edge send-push-notification
# ==================================================================
# Por que existe: a edge send-push-notification esta completa e falha fechada
# quando falta VAPID ("VAPID keys not configured", 500). O codigo esta pronto e
# a feature esta inerte em producao porque as duas variaveis nunca foram
# publicadas no projeto -- o CLI local nao tem escopo de escrita para isso.
#
# O par de chaves NAO e' gerado aqui: ele chega pelos secrets do repositorio
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY, que sao a fonte unica. Gerar dentro do
# workflow produziria um par novo a cada execucao e invalidaria todas as
# subscriptions ja registradas em push_subscriptions.
#
# A chave publica ainda precisa chegar ao front (VITE_VAPID_PUBLIC_KEY na
# Vercel); sem ela o navegador nem cria a subscription. Isso e' passo separado.
# ==================================================================

name: Provisionar VAPID na edge de push

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite APLICAR para publicar as chaves VAPID no projeto oficial'
        required: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: provisionar-vapid
  cancel-in-progress: false

jobs:
  provisionar:
    name: Publicar VAPID_PUBLIC_KEY e VAPID_PRIVATE_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar a entrada e as credenciais
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [[ "${CONFIRMACAO}" != "APLICAR" ]]; then
            echo "::error::confirmacao diferente de APLICAR. Nada foi publicado."
            exit 1
          fi
          faltando=()
          [[ -n "${ACCESS_TOKEN}" ]] || faltando+=("SUPABASE_ACCESS_TOKEN")
          [[ -n "${PROJECT_REF}" ]] || faltando+=("VITE_SUPABASE_PROJECT_ID")
          [[ -n "${VAPID_PUBLIC}" ]] || faltando+=("VAPID_PUBLIC_KEY")
          [[ -n "${VAPID_PRIVATE}" ]] || faltando+=("VAPID_PRIVATE_KEY")
          if (( ${#faltando[@]} > 0 )); then
            echo "::error::faltando: ${faltando[*]}"
            exit 1
          fi
          echo "credenciais presentes; nada sera ecoado."

      - name: Publicar as duas chaves em uma chamada
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          corpo="$(jq -n \
            --arg pub "${VAPID_PUBLIC}" \
            --arg priv "${VAPID_PRIVATE}" \
            '[{name:"VAPID_PUBLIC_KEY",value:$pub},{name:"VAPID_PRIVATE_KEY",value:$priv}]')"
          codigo="$(curl -sS -o resposta.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${corpo}")"
          if [[ "${codigo}" != "200" && "${codigo}" != "201" ]]; then
            echo "::error::Management API respondeu ${codigo} ao publicar secrets. Nada foi assumido como aplicado."
            # A resposta de erro da API nao contem os valores enviados; so o motivo.
            head -c 800 resposta.json || true
            exit 1
          fi
          echo "secrets publicadas (HTTP ${codigo})."
          rm -f resposta.json

      - name: Conferir que as chaves existem no projeto
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          codigo="$(curl -sS -o nomes.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")"
          if [[ "${codigo}" != "200" ]]; then
            echo "::error::GET secrets respondeu ${codigo}; nao da para confirmar a publicacao."
            exit 1
          fi
          # So os NOMES: a resposta traz valores, e log de valor de secret vaza credencial.
          presentes="$(jq -r '[.[].name] | sort | .[]' nomes.json | grep -E '^VAPID_' || true)"
          rm -f nomes.json
          if [[ -z "${presentes}" ]]; then
            echo "::error::nenhuma secret VAPID_* aparece no projeto apos a publicacao."
            exit 1
          fi
          {
            echo "### VAPID provisionado"
            echo ""
            echo "Projeto: \`${PROJECT_REF}\`"
            echo ""
            echo "Secrets presentes (somente nomes):"
            echo ""
            echo '```'
            echo "${presentes}"
            echo '```'
            echo ""
            echo "Falta ainda publicar \`VITE_VAPID_PUBLIC_KEY\` no front (Vercel) para o navegador criar a subscription."
          } >> "$GITHUB_STEP_SUMMARY"