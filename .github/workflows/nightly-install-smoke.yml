name: Nightly Install & Smoke

on:
  schedule:
    # 03:17 UTC every day — off-peak, slightly off-the-hour to avoid runner congestion
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-install-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly install verification + smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate install-report.json
        run: |
          mkdir -p ci-artifacts
          node scripts/install-report.mjs --json | tee ci-artifacts/install-report.json

      # Hard gate: any spec ↔ lock ↔ installed mismatch fails the job
      # immediately, before downstream verify/smoke steps run. This is the
      # earliest point where all three sources are known, so failing here
      # gives the fastest, most actionable signal (and the Slack alert at
      # the end of the job still fires via `if: failure()`).
      - name: Strict drift check (fail-fast)
        run: node scripts/install-report.mjs --strict --json > /dev/null

      - name: Print human-readable install report
        if: always()
        run: node scripts/install-report.mjs

      - name: Verify date-fns versions
        if: always()
        run: bun run verify:date-fns

      - name: Verify date-fns files
        if: always()
        run: bun run verify:datefns-files

      - name: Verify date-fns locales
        if: always()
        run: bun run verify:datefns-locales

      - name: date-fns smoke test
        if: always()
        run: bun run test:date-fns
        env:
          CI: 'true'
          TZ: UTC

      - name: Full smoke gate (ci-smoke.sh)
        if: always()
        run: bash scripts/ci-smoke.sh
        env:
          CI: 'true'
          TZ: UTC

      - name: Upload install-report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-install-report
          path: ci-artifacts/install-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 30

      # Slack alert — only fires when the job failed. Re-uses the install-report
      # artifact written above so the message includes the actual drift detail.
      # Requires repo secret SLACK_WEBHOOK_URL (Settings → Secrets → Actions).
      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/slack-failure-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: 'Nightly install + smoke'
          install-report-path: ci-artifacts/install-report.json

