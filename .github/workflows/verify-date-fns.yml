name: verify-date-fns

# Fails the build if `date-fns` drifts across package.json, bun.lock, and
# node_modules. Backed by `bun run verify:date-fns` (scripts/verify-datefns-versions.mjs),
# which exits non-zero on any drift and prints a pairwise diagnosis explaining
# which file is out of sync and why.
#
# Exit codes surfaced by the script:
#    0  aligned
#   10  spec drifted from lock+installed
#   11  node_modules drifted from spec+lock
#   12  lockfile drifted from spec+installed
#   13  all three sources differ
#   20-23  missing spec / lock / lock-entry / install

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "scripts/verify-datefns-versions.mjs"
      - "scripts/lib/resolve-locked-version.mjs"
      - "scripts/lib/semver-diff.mjs"
      - ".github/workflows/verify-date-fns.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "scripts/verify-datefns-versions.mjs"
      - "scripts/lib/resolve-locked-version.mjs"
      - "scripts/lib/semver-diff.mjs"
      - ".github/workflows/verify-date-fns.yml"

jobs:
  verify-date-fns:
    name: Verify date-fns version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify date-fns alignment (spec ↔ lock ↔ installed)
        id: verify
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          # Capture both stdout (aligned line) and stderr (drift table + fix
          # block) into a single artifact, while still streaming to the job log.
          # `tee` preserves the original exit code via `set -o pipefail` so the
          # job fails on drift exactly as before.
          bun run verify:date-fns 2>&1 | tee ci-artifacts/verify-date-fns.log

      - name: Surface drift table in job summary
        if: failure()
        run: |
          {
            echo "## ❌ date-fns version drift detected"
            echo ""
            echo "The \`verify:date-fns\` gate failed. Full output is attached as the"
            echo "**verify-date-fns-output** artifact (downloadable from this run)."
            echo ""
            echo '```'
            cat ci-artifacts/verify-date-fns.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verify-date-fns output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-date-fns-output
          path: ci-artifacts/verify-date-fns.log
          if-no-files-found: error
          retention-days: 30
