name: verify-datefns-pins

# Runs src/test/datefnsPins.test.ts: every package listed in
# src/test/datefns-pinned-packages.json must be exact-pinned in package.json
# AND its installed version under node_modules must match. Catches range
# drift (^/~) and mismatched lockfile/install state before merge.

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "src/test/datefnsPins.test.ts"
      - "src/test/datefns-pinned-packages.json"
      - "src/test/datefns-pinned-packages.schema.json"
      - ".github/workflows/verify-datefns-pins.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src/test/datefnsPins.test.ts"
      - "src/test/datefns-pinned-packages.json"
      - "src/test/datefns-pinned-packages.schema.json"
      - ".github/workflows/verify-datefns-pins.yml"

concurrency:
  group: verify-datefns-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-check:
    name: date-fns ecosystem exact-pin enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run pin-validation test (vitest, JSON + verbose reporters)
        env:
          CI: 'true'
          TZ: UTC
        run: |
          mkdir -p ci-logs
          set -o pipefail
          bunx vitest run src/test/datefnsPins.test.ts \
            --reporter=verbose \
            --reporter=json --outputFile=ci-logs/datefns-pins.json \
            2>&1 | tee ci-logs/datefns-pins.log

      - name: Surface pin failure in job summary
        if: failure()
        run: |
          {
            echo "## ❌ date-fns pin-validation failed"
            echo ""
            echo "One or more packages in \`src/test/datefns-pinned-packages.json\`"
            echo "are NOT exact-pinned in \`package.json\`, OR the installed"
            echo "version under \`node_modules\` doesn't match the pinned spec."
            echo ""
            echo "**Fix locally:**"
            echo '```bash'
            echo "bun run test src/test/datefnsPins.test.ts   # see exact failure"
            echo "bun add <pkg>@<exact-version>               # re-pin"
            echo "bun install --frozen-lockfile               # restore install"
            echo '```'
            echo ""
            echo "Last 200 log lines:"
            echo '```'
            tail -n 200 ci-logs/datefns-pins.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pin-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-datefns-pins-${{ github.run_id }}
          path: |
            ci-logs/datefns-pins.log
            ci-logs/datefns-pins.json
            src/test/datefns-pinned-packages.json
            package.json
            bun.lock
          if-no-files-found: warn
          retention-days: 14
