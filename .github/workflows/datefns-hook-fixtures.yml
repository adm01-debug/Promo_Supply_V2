name: datefns-hook-fixtures

on:
  pull_request:
    paths:
      - "scripts/hooks/datefns-precommit.sh"
      - "scripts/__tests__/datefns-hook-fixtures.test.sh"
      - "scripts/__tests__/fixtures/datefns-hook/**"
      - "scripts/hooks/fixtures/**"

permissions:
  contents: read

concurrency:
  group: datefns-hook-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-driven-hook-tests:
    name: Fixture-driven hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fixture-driven hook tests
        run: bun run test:hook:datefns:fixtures