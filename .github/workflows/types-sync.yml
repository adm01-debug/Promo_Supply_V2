# docs:
#   gatilho: push na main que toque supabase/migrations ou scripts/types-sync; a cada 10 min (minuto 7); dispatch
#   prova: src/integrations/supabase/types.ts gerado do banco oficial bate com o commitado (Gates 1 e 2)
#   falha: PR em `automation/types-sync` ou issue `[types-sync]`; nunca passa com tipo divergente
#   avisa: PR de types e issue de gate
# nao-e-bug:
#   - banco-pulado: sem o secret SUPABASE_DB_URL o job sai VERDE com aviso no agendamento e no push; no workflow_dispatch falha de proposito, para a pessoa ver
#   - sem-pr-novo: "nada mudou" quando o PR de sync ja esta aberto com o mesmo types.ts — create-pull-request nao cria commit identico
#   - debounce: se o PR de sync tem commit com menos de 20 min, o run e pulado (cadencia de 10 min nao deve empilhar commit)
#   - TYPES_SYNC_PR_TOKEN ausente: esperado — o workflow usa GITHUB_TOKEN; o passo "Destravar os checks" aprova os runs com actions:write
# ==================================================================
# PROMO SUPPLY · Sincronizacao assistida do types.ts do banco
# ==================================================================
# Consulta o banco somente em eventos confiaveis da main. Quando encontra
# drift, valida o candidato e abre/atualiza um PR; NUNCA faz push direto na
# main — a Vercel builda main como producao, entao push direto seria deploy de
# artefato nao revisado.
#
# PROJECT REF — DIVERGENCIA CONHECIDA NO REPO (nao resolvida aqui):
#   supabase/config.toml  -> project_id = "trwgmplubeqxrxpncdgf"
#   .env                  -> VITE_SUPABASE_URL = https://lmypcdfsrgfftzhxawao.supabase.co
# Este workflow NAO escolhe entre os dois: a credencial e o secret
# SUPABASE_DB_URL e a identidade esperada vem do secret VITE_SUPABASE_PROJECT_ID.
# Se os dois secrets apontarem para projetos diferentes, o passo "Exigir
# credencial do banco oficial" falha e nada e proposto. Quem decide qual ref e
# o oficial e o dono, nos secrets — nao este arquivo.
#
# ANTI-LOOP: o PR de sync so altera src/integrations/supabase/types.ts, que
# NAO esta nos `paths` do gatilho de push — o merge do PR nao redispara este
# workflow. Nenhuma negacao de path e necessaria.
#
# TYPES_SYNC_PR_TOKEN e OPCIONAL. Pela politica anti-loop do GitHub, um PR
# aberto com GITHUB_TOKEN nasce com os checks do Actions em "action_required";
# o passo "Destravar os checks do PR de sincronizacao" os aprova com
# actions:write. Um PAT fine-grained com contents:write e pull_requests:write
# tambem funciona (os checks disparam direto e o passo vira no-op).
# ==================================================================

name: types-sync

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/types-sync/**'
      - '.github/workflows/types-sync.yml'
  schedule:
    # Minuto 7 de 10 em 10: fora do minuto 0 (onde o GitHub concentra a fila de
    # agendamentos) e fora do minuto 3, usado pelo contexto.yml.
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: types-sync-${{ github.ref }}-${{ github.event_name == 'schedule' && github.run_id || 'push' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'
  NODE_VERSION: '22'

jobs:
  # Debounce — se existe PR de sync cujo head tem < 20 min, pula o run para nao
  # empilhar commit no PR. No original isso valia so para push (agendamento
  # semanal); aqui o agendamento e de 10 em 10 minutos, entao schedule tambem
  # entra no debounce. Somente workflow_dispatch ignora.
  preflight:
    name: Debounce — verificar PR de sync recente
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        name: Checar idade do head do PR de sync
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('skip', 'false');
              return;
            }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });
            const syncPr = prs.find(pr => pr.labels.some(l => l.name === 'types-sync'));
            if (!syncPr) {
              core.setOutput('skip', 'false');
              return;
            }
            // Usa a data do head commit do PR (nao updated_at, que muda com comentarios).
            const { data: commit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: syncPr.head.sha,
            });
            const headDate = new Date(commit.committer.date);
            const ageSec = Math.floor((Date.now() - headDate.getTime()) / 1000);
            if (ageSec < 1200) {
              core.info(`PR #${syncPr.number} head commit há ${ageSec}s (<20min) — debounce ativo.`);
              core.setOutput('skip', 'true');
            } else {
              core.info(`PR #${syncPr.number} head commit há ${ageSec}s — prosseguindo.`);
              core.setOutput('skip', 'false');
            }

  ler-banco:
    name: Ler banco oficial e gerar candidato
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      types_changed: ${{ steps.diff.outputs.types_changed }}
    steps:
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sem git log nem merge-base: fetch-depth padrao (1) e suficiente.
          persist-credentials: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        # Node explicito em vez de .nvmrc: a Vercel le .nvmrc e um arquivo novo
        # mudaria o build de producao deste repo.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Primeiro passo que toca credencial: decide se o run continua. Sem o
      # secret o job sai VERDE com aviso (144 runs/dia nao podem ficar
      # vermelhos por falta de configuracao); no dispatch manual falha.
      # TLS verify-full + CA Supabase pinada, e a identidade do projeto
      # conferida contra VITE_SUPABASE_PROJECT_ID.
      - name: Exigir credencial do banco oficial
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROJECT_REF_ESPERADO: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::Secret SUPABASE_DB_URL nao definido — sincronizacao de tipos pulada (ver scripts/types-sync/README.md)."
            echo "SYNC_SKIPPED=1" >> "$GITHUB_ENV"
            if [ "$EVENTO" = "workflow_dispatch" ]; then exit 1; fi
            exit 0
          fi
          node --input-type=module <<'NODE'
          import {
            endurecerDestinoTls,
            validarDestino,
            validarSupabaseCa,
          } from './scripts/types-sync/identidade-banco.mjs';
          import { appendFileSync } from 'node:fs';
          const { erros, avisos } = validarDestino(process.env.SUPABASE_DB_URL, process.env.PROJECT_REF_ESPERADO);
          erros.push(...validarSupabaseCa());
          const tls = endurecerDestinoTls(process.env.SUPABASE_DB_URL);
          erros.push(...tls.erros);
          for (const aviso of avisos) console.log('::warning::' + aviso);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          const destinoSeguro = tls.connectionString;
          console.log(`::add-mask::${destinoSeguro}`);
          appendFileSync(process.env.GITHUB_ENV, `SUPABASE_DB_URL=${destinoSeguro}\n`);
          appendFileSync(process.env.GITHUB_ENV, 'PGSSLMODE=verify-full\n');
          console.log('OK: identidade do projeto conferida; TLS verify-full e CA Supabase pinada.');
          NODE

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        if: env.SYNC_SKIPPED != '1'
        uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL (pg_isready)
        if: env.SYNC_SKIPPED != '1'
        run: bash scripts/types-sync/install-postgresql-client.sh

      - name: Instalar pgbouncer (proxy local para credencial do gen types)
        if: env.SYNC_SKIPPED != '1'
        run: bash scripts/types-sync/install-pgbouncer.sh

      # gen-types.sh puxa postgres-meta de um registry de container. GITHUB_TOKEN
      # le pacotes publicos do ghcr.io sem secret extra.
      - name: ghcr.io login (previne rate-limit no gen-types)
        if: env.SYNC_SKIPPED != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin || true
        continue-on-error: true

      # O Supabase CLI 2.116.0 usa public.ecr.aws/supabase/postgres-meta:v0.98.0
      # internamente. O ECR public tem rate-limit anonimo compartilhado entre os
      # runners do GitHub Actions ("toomanyrequests"). Pre-puxa via ghcr.io
      # (autenticado, sem esse limite) e retaga como a imagem ECR: o Docker
      # encontra em cache e nao vai ao ECR quando o CLI disparar o pull.
      - name: Pre-pull postgres-meta via ghcr.io (evita rate-limit do ECR public)
        if: env.SYNC_SKIPPED != '1'
        continue-on-error: true
        run: |
          GHCR_IMG="ghcr.io/supabase/postgres-meta:v0.98.0"
          ECR_IMG="public.ecr.aws/supabase/postgres-meta:v0.98.0"
          if docker pull "$GHCR_IMG" 2>&1; then
            docker tag "$GHCR_IMG" "$ECR_IMG"
            echo "Pre-pull concluido: $ECR_IMG em cache local."
          else
            echo "::warning::Pre-pull de $GHCR_IMG falhou; CLI tentara ECR diretamente."
          fi

      # SUPABASE_DB_URL (ja endurecido com TLS) e PGSSLMODE vem do GITHUB_ENV
      # gravado pelo passo "Exigir credencial" — sem env: proprio aqui, que
      # sobrescreveria com o secret cru, sem TLS.
      - name: Gerar candidato em diretorio temporario
        if: env.SYNC_SKIPPED != '1'
        run: |
          umask 077
          bash scripts/types-sync/gen-types.sh /tmp/types.new.ts

          TYPE_SIZE=$(wc -c < /tmp/types.new.ts)
          echo "types.ts gerado: ${TYPE_SIZE} bytes"
          # O arquivo commitado tem ~309 KB. Abaixo de 100 KB a introspeccao
          # trouxe schema parcial (ou outro banco) e nada deve ser proposto.
          if [ "$TYPE_SIZE" -lt 102400 ]; then
            echo "::error::types.ts menor que 100KB; a identidade do banco precisa ser revisada."
            exit 1
          fi
          grep -q '^export type Database = {' /tmp/types.new.ts

      - name: Classificar drift
        id: diff
        if: env.SYNC_SKIPPED != '1'
        run: |
          # Linhas de comentario sao descartadas na comparacao: o gerador pode
          # mudar cabecalho sem que o schema tenha mudado.
          grep -v '^// ' /tmp/types.new.ts > /tmp/types.new.stripped
          grep -v '^// ' src/integrations/supabase/types.ts > /tmp/types.old.stripped

          if diff -q /tmp/types.new.stripped /tmp/types.old.stripped > /dev/null 2>&1; then
            TYPES_CHANGED=false
          else
            TYPES_CHANGED=true
          fi
          echo "types_changed=${TYPES_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Drift: types=${TYPES_CHANGED}"

      - name: Finalizar se nao houver drift
        if: env.SYNC_SKIPPED != '1' && steps.diff.outputs.types_changed != 'true'
        run: echo "Banco e types.ts commitado estao em sincronia."

      - name: Aplicar candidato no worktree
        if: steps.diff.outputs.types_changed == 'true'
        run: cp /tmp/types.new.ts src/integrations/supabase/types.ts

      # Este artifact serve como evidencia e como transferencia do candidato ao
      # job de gates; falha de upload deve interromper o fluxo.
      - name: Publicar candidato como artifact
        if: steps.diff.outputs.types_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: types-sync-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/integrations/supabase/types.ts
          if-no-files-found: error
          retention-days: 14

  gates-e-pr:
    name: Gates e PR de sincronizacao (sem credencial)
    needs: [preflight, ler-banco]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.skip != 'true' &&
      needs.ler-banco.outputs.types_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Necessaria para aprovar os checks da PR aberta por este job.
      actions: write
    steps:
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Baseline para os dois gates: o types.ts como esta na main.
      - name: Guardar o types.ts commitado como baseline
        run: cp src/integrations/supabase/types.ts /tmp/types.old.ts

      - name: Baixar candidato do job protegido
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: types-sync-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sync-in

      - name: Normalizar candidato baixado
        run: |
          found=$(find /tmp/sync-in -name 'types.ts' -type f -print -quit)
          test -n "$found"
          cp "$found" /tmp/types.new.ts

      - name: Aplicar candidato no worktree
        run: cp /tmp/types.new.ts src/integrations/supabase/types.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependências Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Instalar dependencias
        # --frozen-lockfile primeiro; o repo tem bun.lock e package-lock.json
        # convivendo, e um lockfile defasado nao pode transformar o Gate 1 num
        # passo que falha sempre. O fallback avisa em vez de reprovar o sync.
        run: |
          if ! bun install --frozen-lockfile --ignore-scripts; then
            echo "::warning::bun.lock defasado (--frozen-lockfile falhou); instalando sem lock congelado."
            bun install --ignore-scripts
          fi

      - name: Gate 1 — TypeScript nao piora
        id: gate1
        run: |
          # set -o pipefail: sem ele o tee sempre exita 0 e o gate passaria com
          # o node falhando.
          set -o pipefail
          if node scripts/types-sync/typecheck-ratchet.mjs /tmp/types.old.ts /tmp/types.new.ts 2>&1 | tee /tmp/tsc.log; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gate 1 falhou: novos erros de TypeScript introduzidos pelo novo types.ts."
          fi

      - name: Gate 2 — remocoes destrutivas
        id: gate2
        if: steps.gate1.outputs.passed == 'true'
        run: |
          set -o pipefail
          if node scripts/types-sync/check-remocoes-destrutivas.mjs /tmp/types.old.ts /tmp/types.new.ts 2>&1 | tee /tmp/gate2.log; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gate 2 bloqueou: objeto removido pelo sync ainda tem consumidor no codigo."
          fi

      - name: Garantir label types-sync
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'types-sync',
                color: '0075ca',
                description: 'Sincronizacao automatizada do types.ts do banco'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

      - name: Registrar falha dos gates
        if: >-
          steps.gate1.outputs.passed == 'false' ||
          steps.gate2.outputs.passed == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const gate1 = '${{ steps.gate1.outputs.passed }}';
            const gate2 = '${{ steps.gate2.outputs.passed }}';
            // A CAUSA do alerta e' o gate que falhou, num identificador sem
            // espaco. E' ela que vai no marcador invisivel do corpo e decide o
            // dedupe abaixo.
            const causa = gate1 === 'false' ? 'typescript' : 'remocoes-destrutivas';
            const failed = gate1 === 'false' ? 'TypeScript' : 'remocoes destrutivas';
            const fs = require('fs');
            const excerpt = gate1 === 'false' && fs.existsSync('/tmp/tsc.log')
              ? fs.readFileSync('/tmp/tsc.log', 'utf8').slice(0, 2000)
              : gate2 === 'false' && fs.existsSync('/tmp/gate2.log')
                ? fs.readFileSync('/tmp/gate2.log', 'utf8').slice(0, 2000)
                : '';
            const marker = `<!-- causa:${causa} -->`;
            const title = '[types-sync] Falha ao propor sincronizacao';
            const body = [
              marker,
              `**Gate:** ${failed}`,
              `**Commit da main:** ${{ github.sha }}`,
              `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              excerpt ? `\n\`\`\`\n${excerpt}\n\`\`\`` : ''
            ].filter(Boolean).join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'types-sync'
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              // Sem este dedupe, cada run com o mesmo gate vermelho comentaria
              // de novo (o job roda a cada 10 min) e a issue viraria ruido que
              // ninguem le. So comenta quando a causa MUDA ou o ultimo
              // comentario passou de 6h. O ultimo comentario vem pelo header
              // Link com per_page: 1 — ler so a 1a pagina daria a causa errada.
              const primeira = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 1
              });
              const ultimaPaginaMatch = (primeira.headers?.link || '')
                .match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
              const ultimaPagina = ultimaPaginaMatch ? Number(ultimaPaginaMatch[1]) : 1;
              // Rotaciona a issue apos 20 comentarios para manter legibilidade.
              if (ultimaPagina > 20) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `⚠️ Esta issue atingiu ${ultimaPagina} comentários e está sendo rotacionada para manter legibilidade.\n\nÚltimo alerta antes do fechamento:\n\n---\n\n${body}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed', state_reason: 'completed',
                });
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title,
                  body: `Continuação de #${existing.number} (fechada por atingir ${ultimaPagina} comentários).\n\n---\n\n${body}`,
                  labels: ['types-sync'],
                });
                return;
              }
              const { data: comentarios } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 1,
                page: ultimaPagina
              });
              const ultimo = comentarios[0];
              const causaAnterior = ultimo?.body?.match(/<!-- causa:([a-z-]+) -->/)?.[1] ?? null;
              const idadeUltimoMs = ultimo ? Date.now() - new Date(ultimo.created_at).getTime() : Infinity;
              if (causaAnterior === causa && idadeUltimoMs < 6 * 60 * 60 * 1000) {
                core.info(`Dedupe: mesma causa (${causa}) ha menos de 6h; comentario suprimido.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['types-sync'],
                body
              });
            }

      - name: Falhar quando um gate rejeitar a proposta
        if: >-
          steps.gate1.outputs.passed == 'false' ||
          steps.gate2.outputs.passed == 'false'
        run: |
          echo "::error::A sincronizacao foi bloqueada por um ou mais gates."
          exit 1

      - name: Abrir ou atualizar PR de sincronizacao
        id: pull-request
        if: >-
          steps.gate1.outputs.passed == 'true' &&
          steps.gate2.outputs.passed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          HUSKY: '0'  # Evita que um hook pre-push bloqueie o push interno da action
        with:
          token: ${{ secrets.TYPES_SYNC_PR_TOKEN || github.token }}
          base: main
          branch: automation/types-sync
          delete-branch: true
          commit-message: 'chore(db): sincronizar types.ts com o banco [auto]'
          title: 'chore(db): sincronizar types.ts derivado do banco'
          body: |
            Sincronização automatizada a partir do banco oficial.

            - main de origem: `${{ github.sha }}`
            - types.ts alterado: `${{ needs.ler-banco.outputs.types_changed }}`
            - gates TypeScript e remoções destrutivas: aprovados

            Revisão humana continua obrigatória: este repositório não tem branch
            protection, então o merge é manual de propósito — merge em `main` é
            deploy de produção na Vercel.
          labels: types-sync
          add-paths: |
            src/integrations/supabase/types.ts

      - name: Exigir PR criado ou atualizado
        if: >-
          steps.gate1.outputs.passed == 'true' &&
          steps.gate2.outputs.passed == 'true'
        run: |
          if [ -z "${{ steps.pull-request.outputs.pull-request-number }}" ]; then
            echo "::error::Havia drift validado, mas nenhum PR foi criado ou atualizado."
            exit 1
          fi
          echo "PR #${{ steps.pull-request.outputs.pull-request-number }} pronto para revisao."

      # O PR aberto com GITHUB_TOKEN nao dispara workflows (politica anti-loop
      # do GitHub): os checks nascem em "action_required" e o PR nunca fica
      # verde sozinho. Este passo libera esses runs com actions:write.
      #
      # continue-on-error de proposito: se o GITHUB_TOKEN nao tiver poder para
      # aprovar os proprios runs, o passo registra o motivo no resumo e o PR
      # segue aberto para aprovacao manual. Nunca deve derrubar uma
      # sincronizacao que ja foi validada pelos gates.
      - name: Destravar os checks do PR de sincronizacao
        if: steps.pull-request.outputs.pull-request-number != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Via env, nao interpolado dentro do script: mantem o SHA fora do
          # corpo do JS avaliado.
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        with:
          script: |
            const headSha = process.env.PR_HEAD_SHA;
            if (!headSha) {
              core.warning('create-pull-request nao devolveu o head sha; nada a destravar.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pendentes = [];
            // Os runs aparecem alguns segundos depois do push do PR.
            for (let tentativa = 1; tentativa <= 6; tentativa += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                // Sem `head_branch`, qualquer run `action_required` do MESMO
                // commit entraria no laco e seria aprovado — um run de outra
                // branch no mesmo SHA faria o token liberar check que nao e do
                // PR de tipos.
                head_branch: 'automation/types-sync',
                status: 'action_required',
                per_page: 20,
              });
              pendentes = data.workflow_runs || [];
              if (pendentes.length > 0) break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            if (pendentes.length === 0) {
              core.info('Nenhum run aguardando aprovacao: ou os checks ja dispararam, ou nao ha nada a liberar.');
              return;
            }
            const liberados = [];
            const recusados = [];
            for (const run of pendentes) {
              try {
                await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                liberados.push(run.name);
              } catch (error) {
                recusados.push(`${run.name} (${error.status})`);
              }
            }
            const linhas = [
              '### Checks do PR de sincronizacao',
              `- head sha: \`${headSha}\``,
              `- liberados: ${liberados.length > 0 ? liberados.join(', ') : 'nenhum'}`,
            ];
            if (recusados.length > 0) {
              linhas.push(`- recusados pelo GITHUB_TOKEN: ${recusados.join(', ')}`);
              linhas.push('- acao: aprovar os runs na aba Actions.');
            }
            await core.summary.addRaw(linhas.join('\n')).write();
            if (recusados.length > 0) {
              core.warning(`Nao foi possivel liberar ${recusados.length} run(s) com o GITHUB_TOKEN.`);
            }

      - name: Job summary
        if: always()
        run: |
          {
            echo "## types-sync / gates-e-pr — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| types.ts alterado | ${{ needs.ler-banco.outputs.types_changed || 'n/a' }} |"
            echo "| Gate 1 (TypeScript) | ${{ steps.gate1.outputs.passed || 'n/a' }} |"
            echo "| Gate 2 (remoções) | ${{ steps.gate2.outputs.passed || 'n/a' }} |"
            echo "| PR | ${{ steps.pull-request.outputs.pull-request-number || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Quando o workflow falha, exibe o motivo no Job Summary para facilitar
      # diagnostico sem abrir os logs de cada step.
      - name: Resumo de falha
        if: failure()
        run: |
          {
            echo ""
            echo "## ❌ types-sync falhou"
            echo ""
            # Decide pelo resultado de cada gate (steps.gateN.outputs.passed), nao pela
            # existencia do log: os gates deixam log mesmo quando passam.
            mostrou=0
            mostra() {
              echo "### $1"; echo '```'; head -100 "$2" 2>/dev/null || echo "(log $2 ausente)"; echo '```'; mostrou=1
            }
            [ "${{ steps.gate1.outputs.passed }}" = "false" ] && mostra "Gate 1 — TypeScript" /tmp/tsc.log
            [ "${{ steps.gate2.outputs.passed }}" = "false" ] && mostra "Gate 2 — remoções destrutivas" /tmp/gate2.log
            [ "$mostrou" = 1 ] || echo "Verifique os logs do step anterior para detalhes."
          } >> "$GITHUB_STEP_SUMMARY"
