name: diag rpc tenant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Definicao e permissoes da RPC
        env:
          PGCONNECT_TIMEOUT: '20'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc "select p.oid::regprocedure::text || ' | secdef=' || p.prosecdef::text || ' | acl=' || coalesce(p.proacl::text,'(default)') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_cost_center_performance_report' order by p.oid::regprocedure::text"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc "select 'GUARDA=' || case when pg_get_functiondef(p.oid) ~ 'p_organization_id IS DISTINCT FROM public.get_user_grupo_id' then 'OK' else 'AUSENTE' end from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_cost_center_performance_report' and pg_get_function_identity_arguments(p.oid) like '%p_organization_id%'"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -tAc "select 'sem-arg=' || has_function_privilege('authenticated','public.get_cost_center_performance_report()','execute')::text || ' com-arg=' || has_function_privilege('authenticated','public.get_cost_center_performance_report(uuid)','execute')::text"
