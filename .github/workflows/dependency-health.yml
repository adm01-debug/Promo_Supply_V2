name: dependency-health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate dependency-health.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Verify lockfile is up to date
        run: bun install --frozen-lockfile --dry-run
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Restore tree-shaking scan cache
        uses: actions/cache@v4
        with:
          path: public/dependency-health.json
          key: ${{ runner.os }}-deps-health-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'scripts/generate-dependency-health.mjs') }}
          restore-keys: |
            ${{ runner.os }}-deps-health-
      - name: Regenerate dependency-health snapshot
        run: bun run deps:health
      - name: Append discovered date-fns subpaths
        run: bun run verify:datefns-files:write
      - name: Regenerate dependency-health HTML report
        run: node scripts/generate-dependency-health-html.mjs
      - name: Upload dependency-health report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health-${{ github.run_id }}
          path: |
            public/dependency-health.json
            public/dependency-health.html
          if-no-files-found: warn
          retention-days: 14
      - name: Commit updated report if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): refresh dependency-health report [skip ci]"
          file_pattern: public/dependency-health.json public/dependency-health.html
