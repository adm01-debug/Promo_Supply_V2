name: Freight Quest CI/CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Linting Check
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

      - name: Unit & Integration Tests
        run: bun run test

      - name: Playwright E2E Tests
        run: |
          bunx playwright install --with-deps
          bun run test:e2e

      - name: Backend Stress & Load Test (Artillery)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          bun run test:load

      - name: Edge Functions Contract & Simulation Gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/system-simulation" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"iterations": 20, "validate_contracts": true}'
