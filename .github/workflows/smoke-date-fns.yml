name: smoke-date-fns

# Fast-failing PR gate: runs `bun run smoke:date-fns` so pull requests fail
# the moment a date-fns subpath imported anywhere in src/ doesn't exist on the
# pinned version. The smoke script:
#   1. Regenerates src/test/dateFns.smoke.test.ts from current src/ imports.
#   2. Verifies every imported date-fns subpath exists in node_modules/date-fns.
#   3. Runs the smoke vitest file.
#
# Triggers narrowed so this gate fires ONLY when something that could
# affect a date-fns import or the resolved version actually changes:
#   • TypeScript/JS sources under src/ (any file that could `import 'date-fns/...'`).
#     Non-code src changes — *.css, *.md, *.json, *.svg, *.png, snapshots, etc.
#     — no longer trigger this workflow, which removes the bulk of unrelated
#     PR runs. (GH Actions doesn't support `paths` + `paths-ignore` in the
#     same trigger, so the file-extension allow-list is the cleanest filter.)
#   • package.json / bun.lock — any version bump or transitive resolution change.
#   • The smoke scripts, generator, verifier, generated test, smoke tsconfig.
#   • This workflow file itself.

on:
  pull_request:
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.mts"
      - "src/**/*.cts"
      - "src/**/*.js"
      - "src/**/*.jsx"
      - "src/**/*.mjs"
      - "src/**/*.cjs"
      - "package.json"
      - "bun.lock"
      - "scripts/smoke-date-fns.sh"
      - "scripts/generate-datefns-smoke-test.mjs"
      - "scripts/verify-datefns-files.mjs"
      - "src/test/dateFns.smoke.test.ts"
      - "tsconfig.smoke.json"
      - ".github/workflows/smoke-date-fns.yml"
  push:
    branches: [main]
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.mts"
      - "src/**/*.cts"
      - "src/**/*.js"
      - "src/**/*.jsx"
      - "src/**/*.mjs"
      - "src/**/*.cjs"
      - "package.json"
      - "bun.lock"
      - "scripts/smoke-date-fns.sh"
      - "scripts/generate-datefns-smoke-test.mjs"
      - "scripts/verify-datefns-files.mjs"
      - "src/test/dateFns.smoke.test.ts"
      - "tsconfig.smoke.json"
      - ".github/workflows/smoke-date-fns.yml"

concurrency:
  group: smoke-date-fns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-date-fns:
    name: date-fns subpath smoke (PR fast-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Cache the generated smoke test + its input-signature manifest across
      # CI runs. The cache key hashes every file the generator actually
      # reads (src/**/*.{ts,tsx}, the generator + scanner scripts, and the
      # pinned date-fns spec from package.json). When NONE of those have
      # changed since the cached run, restoring puts back:
      #   - public/datefns-usage.json    (manifest with importSignature)
      #   - src/test/dateFns.smoke.test.ts (generated output)
      # …and the smoke pipeline's step 1 (`--if-changed`) short-circuits
      # because the in-memory signature it computes equals the one on disk.
      # When ANY input changes, the key changes → cache miss → full regen.
      # The restore-keys fallback lets a near-miss (e.g. one src file
      # changed) still re-use the previous artifact for diff context;
      # the generator will detect the signature mismatch and regenerate
      # before the verifier runs, so correctness is preserved either way.
      - name: Cache generated date-fns smoke test
        uses: actions/cache@v4
        with:
          path: |
            src/test/dateFns.smoke.test.ts
            public/datefns-usage.json
          key: datefns-smoke-gen-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'scripts/generate-datefns-smoke-test.mjs', 'scripts/lib/datefns-scan.mjs', 'package.json') }}
          restore-keys: |
            datefns-smoke-gen-${{ runner.os }}-

      - name: Run smoke:date-fns (regen + subpath existence + smoke test)
        id: smoke
        env:
          CI: 'true'
          TZ: UTC
          # Picked up by scripts/verify-datefns-files.mjs to write a concise
          # Markdown drift table — pinned date-fns version + missing-subpath
          # rows grouped by Functions/Locales — that the next step appends
          # to $GITHUB_STEP_SUMMARY. Emitted on BOTH pass and fail; the
          # verifier still exits non-zero on drift, which propagates through
          # `bun run smoke:date-fns` and fails this step.
          DATEFNS_SMOKE_SUMMARY_MD: ci-artifacts/datefns-drift.md
          # Picked up by scripts/verify-datefns-files.mjs to write the FULL
          # failure report (partitioned missing list + copy-paste bare list +
          # likely-cause diagnosis + 3-step repair recipe with exact commands)
          # to this path. Written ONLY on failure — uploaded as the dedicated
          # `smoke-date-fns-failure-report` artifact below so reviewers get
          # the full repair recipe offline without scrolling job logs.
          DATEFNS_SMOKE_REPORT_MD: ci-artifacts/datefns-failure-report.md
          # Machine-readable sibling of the Markdown report. Versioned schema
          # (`schemaVersion: 1`) listing every missing subpath, its offender
          # `file:line` list, the pinned date-fns version, and a one-step
          # reinstall command. Lets dashboards / bots consume drift without
          # scraping Markdown. Written ONLY on failure.
          DATEFNS_SMOKE_REPORT_JSON: ci-artifacts/missing-datefns-subpaths.json
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          start_ms=$(date +%s%3N)
          if bun run smoke:date-fns 2>&1 | tee ci-artifacts/smoke-date-fns.log; then
            smoke_status=pass
            exit_code=0
          else
            smoke_status=fail
            exit_code=$?
          fi
          end_ms=$(date +%s%3N)
          echo "status=$smoke_status" >> "$GITHUB_OUTPUT"
          echo "duration_ms=$((end_ms - start_ms))" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # Append the verifier's drift table to the GitHub job summary on every
      # run (pass or fail). On a clean run this is a single ✓ line; on drift
      # it's the full Markdown table with each missing subpath, the file
      # count that imported it, and the pinned date-fns version. This step
      # NEVER changes the job's pass/fail state — that's owned by the smoke
      # step above, which already exits non-zero when the verifier finds drift.
      - name: Append drift table to job summary
        if: always()
        run: |
          if [ -f ci-artifacts/datefns-drift.md ]; then
            cat ci-artifacts/datefns-drift.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(no drift table — verifier did not run, e.g. install failed)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record smoke result into dependency-health.json
        if: always()
        run: |
          node scripts/record-smoke-result.mjs \
            --status "${{ steps.smoke.outputs.status || 'fail' }}" \
            --duration-ms "${{ steps.smoke.outputs.duration_ms || '0' }}" \
            --test-file "src/test/dateFns.smoke.test.ts" \
            --log-file "ci-artifacts/smoke-date-fns.log"

      - name: Upload updated dependency-health.json (smoke result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health-smoke-${{ github.run_id }}
          path: |
            public/dependency-health.json
            public/logs/smoke-date-fns-latest.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated snapshot (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): record smoke test result + log [skip ci]"
          file_pattern: |
            public/dependency-health.json
            public/logs/smoke-date-fns-latest.log

      - name: Surface smoke failure in job summary
        if: failure()
        run: |
          {
            echo "## ❌ date-fns subpath smoke failed"
            echo ""
            echo "A date-fns import in \`src/\` references a subpath that doesn't"
            echo "exist on the pinned version, or the smoke test failed."
            echo ""
            echo "Full log is attached as the **smoke-date-fns-output** artifact."
            echo ""
            echo '```'
            tail -n 200 ci-artifacts/smoke-date-fns.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke-date-fns output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-date-fns-output
          path: |
            ci-artifacts/smoke-date-fns.log
            ci-artifacts/datefns-drift.md
          if-no-files-found: error
          retention-days: 30

      # Dedicated failure-only artifact: the full Markdown failure report
      # written by scripts/verify-datefns-files.mjs (via DATEFNS_SMOKE_REPORT_MD).
      # Includes the partitioned missing-subpath table, copy-paste bare list,
      # likely-cause diagnosis, and the exact 3-step repair recipe with the
      # date-fns version pinned at the moment of failure. Only created when
      # drift is detected, so this step is gated on `failure()` and uses
      # `if-no-files-found: warn` defensively (e.g. if the verifier crashed
      # before reaching the report writer).
      - name: Upload missing-subpath failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-date-fns-failure-report
          path: |
            ci-artifacts/datefns-failure-report.md
            ci-artifacts/missing-datefns-subpaths.json
          if-no-files-found: warn
          retention-days: 30
