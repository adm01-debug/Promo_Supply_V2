name: lint-date-fns

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-date-fns:
    name: ESLint date-fns subpath gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Verify lockfile is up to date (no drift vs package.json)
        run: bun install --frozen-lockfile --dry-run
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run ESLint date-fns gate
        run: bun run ci:lint:date-fns
      - name: Run ESLint rule unit tests (vitest)
        # Exercises eslint-rules/__tests__/*.behavior.test.ts so any change to
        # the local/date-fns-subpath rule (autofix targets, locale mapping,
        # report-only branches) is caught on the same PR that ships it.
        run: bunx vitest run eslint-rules/__tests__
        env:
          CI: 'true'
          TZ: UTC
