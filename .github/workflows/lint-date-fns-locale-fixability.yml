name: lint-date-fns-locale-fixability

# Dry-run the `local/date-fns-subpath` autofix over `src/` and fail the
# build if ANY `date-fns/locale*` violation is reported as unfixable.
# Catches:
#   - codebase imports a locale identifier that isn't in the rule's
#     LOCALE_SUBPATHS map (typo, or a date-fns upgrade added a new
#     locale and we forgot to update the map),
#   - regressions to the rule that accidentally turn a fixable shape
#     into an unfixable one.
#
# This is intentionally a read-only gate — the workflow NEVER commits
# the autofix back. The goal is "every locale violation must be safely
# auto-correctable", not "auto-correct on CI".

on:
  pull_request:
    paths:
      - 'src/**'
      - 'eslint-rules/**'
      - 'eslint.config.js'
      - 'eslint.date-fns.config.js'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/check-datefns-locale-fixability.mjs'
      - '.github/workflows/lint-date-fns-locale-fixability.yml'
  push:
    branches: [main]

jobs:
  locale-fixability:
    name: date-fns locale autofix coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run ESLint with --fix-dry-run (date-fns config, JSON output)
        # `|| true` because ESLint exits non-zero whenever it finds any
        # error — we need the JSON file to exist regardless so the
        # fixability checker can analyze it. Real failures are surfaced
        # by the next step's exit code, which is the gate we care about.
        run: |
          mkdir -p ci-artifacts
          bunx eslint --config eslint.date-fns.config.js \
            --fix-dry-run \
            -f json \
            -o ci-artifacts/datefns-dryrun.json \
            'src/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}' || true

      - name: Assert every date-fns/locale violation is autofixable
        id: gate
        run: |
          set -o pipefail
          node scripts/check-datefns-locale-fixability.mjs \
            ci-artifacts/datefns-dryrun.json \
            2>&1 | tee ci-artifacts/locale-fixability.log

      - name: Append summary to GitHub step summary
        if: always()
        run: |
          {
            echo "## date-fns locale autofix coverage"
            echo ""
            if [ -f ci-artifacts/datefns-locale-fixability.json ]; then
              total=$(jq -r '.totalLocaleViolations' ci-artifacts/datefns-locale-fixability.json)
              fixable=$(jq -r '.fixable' ci-artifacts/datefns-locale-fixability.json)
              unfixable=$(jq -r '.unfixable' ci-artifacts/datefns-locale-fixability.json)
              echo "| Metric | Count |"
              echo "|---|---:|"
              echo "| Total locale violations | $total |"
              echo "| Fixable                 | $fixable |"
              echo "| Unfixable               | $unfixable |"
              if [ "$unfixable" != "0" ]; then
                echo ""
                echo "### Unfixable violations"
                echo ""
                echo '```'
                jq -r '.unfixableViolations[] | "\(.file):\(.line):\(.column)  [\(.messageId)]\n  \(.sourceLine)\n  → \(.message)"' \
                  ci-artifacts/datefns-locale-fixability.json
                echo '```'
                echo ""
                echo "**Fix**: either correct the locale identifier in source, OR add the missing"
                echo "camelCase→kebab mapping to \`LOCALE_SUBPATHS\` in"
                echo "\`eslint-rules/date-fns-subpath.js\`."
              fi
            else
              echo "_No fixability report was produced — see job logs._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datefns-locale-fixability
          path: |
            ci-artifacts/datefns-dryrun.json
            ci-artifacts/datefns-locale-fixability.json
            ci-artifacts/locale-fixability.log
          if-no-files-found: ignore
          retention-days: 14
