name: verify-datefns-smoke

# Fast-fail PR gate: runs `bun run verify:datefns-smoke` (a --dry-run of the
# generator) so a pull request fails the moment src/test/dateFns.smoke.test.ts
# would drift from the current `date-fns/*` imports under src/. No regen, no
# vitest — purely "would the generator produce a different file?".
#
# Complements smoke-date-fns.yml (which actually runs the smoke vitest) by
# catching drift faster and with a clearer error.

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "scripts/generate-datefns-smoke-test.mjs"
      - "scripts/lib/datefns-scan.mjs"
      - "src/test/dateFns.smoke.test.ts"
      - "public/datefns-usage.json"
      - ".github/workflows/verify-datefns-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "scripts/generate-datefns-smoke-test.mjs"
      - "scripts/lib/datefns-scan.mjs"
      - "src/test/dateFns.smoke.test.ts"
      - "public/datefns-usage.json"
      - ".github/workflows/verify-datefns-smoke.yml"

concurrency:
  group: verify-datefns-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify date-fns smoke test is in sync (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run verify:datefns-smoke (generator dry-run — fails on drift in smoke test OR manifest)
        env:
          CI: 'true'
          TZ: UTC
        # `verify:datefns-smoke` runs the generator in --dry-run mode. It
        # diffs BOTH src/test/dateFns.smoke.test.ts and
        # public/datefns-usage.json against what the generator would write,
        # and exits 1 if EITHER would change. So this single step guards
        # both files — drift in the manifest alone (e.g. a locale-only
        # change) still fails the job.
        run: |
          mkdir -p ci-logs
          set -o pipefail
          bun run verify:datefns-smoke 2>&1 | tee ci-logs/verify-datefns-smoke.log

      - name: Confirm tracked files are byte-identical to generator output
        if: always()
        # Belt-and-suspenders: even if the dry-run diff logic ever regresses,
        # actually regenerate into a temp dir and `diff` against the tracked
        # files. Catches the case where someone hand-edits either file.
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp src/test/dateFns.smoke.test.ts "$tmp/smoke.before.ts"
          cp public/datefns-usage.json "$tmp/manifest.before.json"
          node scripts/generate-datefns-smoke-test.mjs >/dev/null
          status=0
          if ! diff -u "$tmp/smoke.before.ts" src/test/dateFns.smoke.test.ts; then
            echo "✗ src/test/dateFns.smoke.test.ts is out of date — run: bun run date-fns:smoke -- --force"
            status=1
          fi
          if ! diff -u "$tmp/manifest.before.json" public/datefns-usage.json; then
            echo "✗ public/datefns-usage.json is out of date — run: bun run date-fns:smoke -- --force"
            status=1
          fi
          # Restore so subsequent steps see the committed files unchanged.
          cp "$tmp/smoke.before.ts" src/test/dateFns.smoke.test.ts
          cp "$tmp/manifest.before.json" public/datefns-usage.json
          exit "$status"

      - name: Surface drift in job summary
        if: failure()
        run: |
          {
            echo "## ❌ date-fns smoke test is out of sync"
            echo ""
            echo "\`src/test/dateFns.smoke.test.ts\` no longer matches the"
            echo "\`date-fns/*\` imports under \`src/\`."
            echo ""
            echo "**Fix locally:**"
            echo '```bash'
            echo "bun run date-fns:smoke -- --force"
            echo "git add src/test/dateFns.smoke.test.ts public/datefns-usage.json"
            echo '```'
            echo ""
            echo "Full log:"
            echo '```'
            tail -n 200 ci-logs/verify-datefns-smoke.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-datefns-smoke-log
          path: ci-logs/verify-datefns-smoke.log
          if-no-files-found: warn
          retention-days: 14
