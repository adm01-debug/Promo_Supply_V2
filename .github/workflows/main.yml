name: Freight Quest CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, RLS Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Linting
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

      - name: Security RLS Audit
        run: |
          # Run the audit script if it exists
          if [ -f "scripts/rls-audit.ts" ]; then
            bun run scripts/rls-audit.ts
          fi

  unit-integration-tests:
    name: Unit & Integration Tests (Frontend + Edge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: bun install

      - name: Run Vitest (Frontend)
        run: bun run test

      - name: Run Deno Tests (Edge Functions)
        run: |
          # Deno integration tests skip gracefully when Supabase is unavailable.
          # Set VITE_SUPABASE_URL to a real project URL via CI secrets to run them.
          export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}"
          deno test --allow-net --allow-env --allow-read supabase/functions/tests/

  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    env:
      # Minimal placeholder values so the Vite dev server can start.
      # Set real values via CI secrets to run E2E tests against a live environment.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --project=chromium
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
