# docs:
#   gatilho: push em main/develop e pull_request para main
#   prova: lint, typecheck, guard de integridade do AGENTS.md (em PR), Vitest do front, testes Deno das edges e E2E Playwright
#   falha: o check fica vermelho; nao ha branch protection neste repo, entao quem mergeia e responsavel por ler o resultado
#   avisa: ninguem no PR; falha na main abre issue pelo notifica-falha-main.yml
# nao-e-bug:
#   - nome-do-arquivo: o `name:` ainda e "Freight Quest CI/CD", herdado de outro projeto; renomear quebraria a lista de `workflows:` do notifica-falha-main.yml, que casa por nome
#   - deno-faixa-flutuante: `deno-version: v1.x` nao e versao fixa de proposito, e por isso deno NAO esta em .github/toolchain.json
#   - e2e-com-placeholder: sem os secrets VITE_*, o E2E sobe o dev server com valores de placeholder e falha nos fluxos logados
name: Freight Quest CI/CD

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, RLS Audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      # As suites de scripts/ rodam no job `suites` do guards.yml, que cobre
      # `scripts/ci/*.unit.mjs` E `scripts/lib/*.test.mjs` e ainda roda o
      # check-test-inventory.mjs (que reprova suite sem passo em workflow). Rodar aqui
      # tambem pagava o mesmo minuto de Actions duas vezes por PR, em repo privado.

      - name: Integrity Guard AGENTS.md (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/ci/check-agents-md-integrity.mjs
        env:
          AGENTS_MD_BASE: origin/${{ github.base_ref }}

      - name: Linting
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

      - name: Security RLS Audit
        run: |
          # Run the audit script if it exists
          if [ -f "scripts/rls-audit.ts" ]; then
            bun run scripts/rls-audit.ts
          fi

  unit-integration-tests:
    name: Unit & Integration Tests (Frontend + Edge)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: bun install

      - name: Run Vitest (Frontend)
        run: bun run test

      - name: Run Deno Tests (Edge Functions)
        run: |
          # Deno integration tests skip gracefully when Supabase is unavailable.
          # Set VITE_SUPABASE_URL to a real project URL via CI secrets to run them.
          export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}"
          # supabase/functions/run-audit/rls_test.ts le SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY
          # (nomes sem prefixo VITE_) para montar um client admin via service role.
          # Sem isso o teste morre com "supabaseUrl is required". SUPABASE_SERVICE_ROLE_KEY
          # ainda precisa ser cadastrado como secret pelo dono (nunca passa por este workflow
          # como valor hardcoded).
          export SUPABASE_URL="${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}"
          export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}"
          # Alvo: supabase/functions/ (nao supabase/functions/tests/). Aquela pasta so tem
          # fuzzing_suite.ts e integration_suite.ts, nomes que o Deno nao reconhece como teste
          # (*_test.ts / *.test.ts), entao o passo morria com "No test modules found" e os 9
          # arquivos de teste reais sob supabase/functions/ nunca rodaram.
          deno test --allow-net --allow-env --allow-read supabase/functions/

  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-24.04
    needs: [quality-gate]
    env:
      # Minimal placeholder values so the Vite dev server can start.
      # Set real values via CI secrets to run E2E tests against a live environment.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --project=chromium
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
