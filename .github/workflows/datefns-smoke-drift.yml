name: datefns-smoke-drift

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify date-fns smoke test is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Verify smoke test is in sync
        env:
          TZ: UTC
        run: |
          mkdir -p ci-logs
          set -o pipefail
          bun run verify:datefns-smoke 2>&1 | tee ci-logs/verify-smoke-drift.log
      - name: Validate smoke test types
        env:
          TZ: UTC
        run: |
          mkdir -p ci-logs
          set -o pipefail
          bun run verify:datefns-smoke-types 2>&1 | tee ci-logs/verify-smoke-types.log
      - name: Verify smoke test freshness (size + locale-import set)
        env:
          TZ: UTC
        run: |
          mkdir -p ci-logs
          set -o pipefail
          bun run verify:datefns-smoke-freshness 2>&1 | tee ci-logs/verify-smoke-freshness.log
      - name: Verify generator-input hash (subpaths + date-fns version + generator)
        env:
          TZ: UTC
        run: |
          mkdir -p ci-logs
          set -o pipefail
          # Compares hash of (sorted src date-fns subpaths + installed date-fns
          # version + pinned spec + generator script fingerprint) against the
          # value stored in public/datefns-generator-input.json. Exits 2 if
          # regeneration is required, with a per-input diff in the log.
          bun run verify:datefns-generator-input 2>&1 | tee ci-logs/verify-generator-input.log
          # Persist the JSON report as an artifact for inspection.
          node scripts/verify-datefns-generator-input.mjs --json --quiet \
            > ci-logs/verify-generator-input.json || true
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datefns-smoke-drift-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
