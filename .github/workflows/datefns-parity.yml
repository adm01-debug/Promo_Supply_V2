name: datefns-parity

# Guards against bun ↔ npm divergence for date-fns.
#
# Every other date-fns workflow installs with `bun install --frozen-lockfile`,
# which means an npm-only consumer (Vercel preview, contributor without bun,
# downstream tooling) could see a different resolved tree without anyone
# noticing until production breaks.
#
# This job intentionally:
#   1. Installs with `npm ci` (NOT bun) using the committed package-lock.json.
#   2. Runs `npm run test:date-fns:parity`, which invokes
#      `scripts/verify-test-datefns-parity.mjs` — the same script developers
#      run locally — to assert the npm-resolved date-fns subpath set matches
#      what bun resolves.
#
# Triggers cover anything that could shift either resolver's view of date-fns.

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "scripts/verify-test-datefns-parity.mjs"
      - "scripts/verify-datefns-files.mjs"
      - "scripts/generate-datefns-smoke-test.mjs"
      - ".github/workflows/datefns-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "scripts/verify-test-datefns-parity.mjs"
      - "scripts/verify-datefns-files.mjs"
      - "scripts/generate-datefns-smoke-test.mjs"
      - ".github/workflows/datefns-parity.yml"
  # Weekly heartbeat: catches drift introduced by transitive updates even when
  # nothing in the matched paths changed.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: datefns-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: bun ↔ npm date-fns parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Deliberately use npm here — the entire purpose of this job is to
      # exercise the npm resolution path. Do NOT swap for bun.
      - name: Install with npm (frozen lockfile)
        run: npm ci

      - name: Run npm run test:date-fns:parity
        id: parity
        env:
          CI: "true"
          TZ: UTC
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          # The script auto-appends a markdown summary to $GITHUB_STEP_SUMMARY
          # and also writes a machine-readable JSON copy we upload as an
          # artifact. --quiet trims duplicate human-readable output from the
          # log, since the structured blocks below cover the same ground.
          if npm run test:date-fns:parity -- \
              --quiet \
              --json-out ci-artifacts/datefns-parity-summary.json \
              --md-out   ci-artifacts/datefns-parity-summary.md \
              2>&1 | tee ci-artifacts/datefns-parity.log; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Surface parity failure in job summary
        if: failure()
        run: |
          {
            echo "## ❌ bun ↔ npm date-fns parity failed"
            echo ""
            echo "The set of date-fns subpaths resolvable via \`npm ci\` differs"
            echo "from what bun resolves. This means an npm-only consumer would"
            echo "see a different module tree than CI does."
            echo ""
            echo "▶ Reproduce locally:"
            echo '```bash'
            echo "rm -rf node_modules"
            echo "npm ci"
            echo "npm run test:date-fns:parity"
            echo '```'
            echo ""
            echo "Full log:"
            echo '```'
            tail -n 200 ci-artifacts/datefns-parity.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datefns-parity-log-${{ github.run_id }}
          path: |
            ci-artifacts/datefns-parity.log
            ci-artifacts/datefns-parity-summary.json
            ci-artifacts/datefns-parity-summary.md
          if-no-files-found: warn
          retention-days: 30
